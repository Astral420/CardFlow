name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: card_tool
          POSTGRES_PASSWORD: card_tool
          POSTGRES_DB: card_tool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U card_tool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg2://card_tool:card_tool@localhost:5432/card_tool
          REDIS_URL: redis://localhost:6379/0
